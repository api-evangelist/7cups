name: 7 Cups
description: 7 Cups (7cups.com) is an on-demand emotional health and online therapy service founded in
  2013 and backed by Y Combinator. It connects people seeking support with a network of trained volunteer
  listeners for free, anonymous one-on-one chat, and matches members with licensed therapists and social
  workers for paid online therapy delivered by messaging, audio, or video. The platform also runs peer
  community forums, group support chat rooms, and self-help "growth path" content. 7 Cups operates across
  189 countries in 140 languages with hundreds of thousands of trained listeners. It is a consumer web
  and mobile product rather than an API-first developer platform; this profile is maintained in the API
  Evangelist network as a company record and carries no public API at this time.
